<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Contagem Regressiva • DW Tech</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07101d;color:#fff;padding:20px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,#07101df2,#07101d99),url('campanha.jpg') center/cover no-repeat;filter:blur(22px) saturate(1.15);transform:scale(1.08);z-index:-2}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 75% 20%,#ffc4002b,transparent 34%),radial-gradient(circle at 20% 80%,#006bd12b,transparent 36%);z-index:-1}
.wrap{width:min(1320px,100%);margin:auto}.brand{text-align:center;font-weight:900;letter-spacing:.18em;color:#ffbf00;margin:4px 0 16px}
.stage{display:grid;grid-template-columns:minmax(300px,.78fr) minmax(430px,1.22fr);gap:20px;align-items:stretch}
.campaign{position:relative;min-height:760px;border-radius:30px;overflow:hidden;border:1px solid #ffffff26;box-shadow:0 30px 80px #000a;background:#111}
.campaign img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center;transition:transform .6s ease}.campaign:hover img{transform:scale(1.018)}
.campaign:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px #0003;pointer-events:none}
.panel{display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(145deg,#0b1d36e8,#06101ee8);border:1px solid #ffffff24;border-radius:30px;padding:clamp(26px,4vw,56px);box-shadow:0 30px 80px #0009;backdrop-filter:blur(18px)}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#ffbf00;font-weight:900;margin-bottom:12px}
h1{font-size:clamp(38px,5vw,72px);line-height:.95;margin:0 0 18px;text-transform:uppercase}.sub{color:#d4deed;font-size:clamp(14px,1.4vw,18px);margin-bottom:22px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.box{background:linear-gradient(180deg,#102846,#071424);border:1px solid #ffffff20;border-radius:20px;padding:26px 6px;box-shadow:inset 0 1px #ffffff14}.num{display:block;font-size:clamp(38px,5.5vw,76px);font-weight:950;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 28px #1c78d855}.lab{display:block;color:#ffbf00;text-transform:uppercase;font-size:11px;font-weight:900;letter-spacing:.13em;margin-top:10px}
.actions{display:flex;justify-content:center;margin-top:12px}button{border:1px solid #ffffff28;border-radius:999px;padding:13px 22px;font:inherit;background:#ffffff12;color:#fff;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)}button:hover{background:#ffffff20}.done{font-size:clamp(34px,7vw,74px);font-weight:900;color:#ffbf00}
footer{text-align:center;margin-top:16px;color:#9ba9bc;font-size:12px;letter-spacing:.06em}.visits{display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;padding:7px 12px;border:1px solid #ffffff18;border-radius:999px;background:#ffffff0a;color:#c8d2df;font-variant-numeric:tabular-nums}.visits b{color:#ffbf00}
@media(max-width:850px){body{padding:10px}.stage{grid-template-columns:1fr}.campaign{min-height:auto;aspect-ratio:3/4}.panel{margin-top:-54px;position:relative;z-index:2;border-radius:28px;padding:28px 14px 22px}.timer{gap:7px}.box{padding:18px 3px;border-radius:15px}.num{font-size:clamp(34px,12vw,58px)}h1{font-size:clamp(34px,11vw,52px)}}
@media(max-width:520px){.timer{grid-template-columns:repeat(2,1fr)}.campaign{aspect-ratio:4/5;}.campaign img{object-position:center top}}
</style></head>
<body><main class="wrap"><div class="brand">DW TECH</div><div class="stage"><section class="campaign"><img src="campanha.jpg" alt="Arte da campanha"></section><section class="panel"><div class="eyebrow">Olho d’Água das Cunhãs • MA</div>
<h1 id="title">Eleições 2026</h1><div class="sub" id="targetText">Contagem regressiva para o encerramento da votação • 04/10/2026 às 17:00</div>
<div class="timer" id="timer">
<div class="box"><span class="num" id="days">00</span><span class="lab">Dias</span></div>
<div class="box"><span class="num" id="hours">00</span><span class="lab">Horas</span></div>
<div class="box"><span class="num" id="minutes">00</span><span class="lab">Minutos</span></div>
<div class="box"><span class="num" id="seconds">00</span><span class="lab">Segundos</span></div></div>
<div class="actions"><button class="secondary" onclick="fullscreen()">Tela cheia</button></div>
</section></div><footer><div class="visits" title="Total de visualizações desta página">👁 <b id="visitCount">—</b> visualizações</div><br>Dill • Tecnologia • Design • Inovação</footer></main>
<script>
const $=id=>document.getElementById(id);let end=new Date('2026-10-04T17:00:00-03:00').getTime(),interval;
function pad(n){return String(n).padStart(2,'0')}
function tick(){if(!end)return;let diff=end-Date.now();if(diff<=0){$('timer').innerHTML='<div class="done" style="grid-column:1/-1">CHEGOU A HORA!</div>';clearInterval(interval);return}const d=Math.floor(diff/864e5);diff%=864e5;const h=Math.floor(diff/36e5);diff%=36e5;const m=Math.floor(diff/6e4);const s=Math.floor((diff%6e4)/1000);$('days').textContent=pad(d);$('hours').textContent=pad(h);$('minutes').textContent=pad(m);$('seconds').textContent=pad(s)}
function fullscreen(){document.documentElement.requestFullscreen?.()}
async function countVisit(){
  const el=$('visitCount');
  el.textContent='...';
  try{
    const r=await fetch('https://api.counterapi.dev/v1/dillresgate/contador-eleicoes-2026/up',{cache:'no-store'});
    if(!r.ok) throw new Error();
    const j=await r.json();
    const n=j.count??j.value??j.data?.count;
    if(n==null) throw new Error();
    el.textContent=Number(n).toLocaleString('pt-BR');
  }catch(e){
    el.textContent='indisponível';
  }
}
countVisit();
tick();interval=setInterval(tick,1000);
// Atualização oculta a cada 5 segundos sem recarregar a página.
setInterval(()=>{
  tick();
},5000);
</script></body></html>
