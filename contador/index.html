<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#263247 0,#10151f 48%,#07090d 100%);color:#fff;display:grid;place-items:center;padding:22px}
.wrap{width:min(1100px,100%);text-align:center}.brand{font-weight:900;letter-spacing:.12em;color:#ff7a18;margin-bottom:18px}.panel{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:28px;padding:clamp(22px,5vw,54px);box-shadow:0 30px 80px #0008;backdrop-filter:blur(16px)}
h1{font-size:clamp(28px,5vw,56px);margin:0 0 10px}.sub{color:#aeb7c6;margin-bottom:30px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}.box{background:#090d14;border:1px solid #ffffff18;border-radius:20px;padding:24px 8px}.num{display:block;font-size:clamp(38px,8vw,88px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.lab{display:block;color:#ff8a2a;text-transform:uppercase;font-size:12px;letter-spacing:.15em;margin-top:10px}
.controls{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px;max-width:820px;margin:auto}input,button{border:0;border-radius:12px;padding:14px;font:inherit}input{background:#fff;color:#111}button{background:#ff7a18;color:white;font-weight:800;cursor:pointer}.secondary{background:#ffffff18}.actions{display:flex;gap:10px;justify-content:center;margin-top:12px}.done{font-size:clamp(34px,7vw,74px);font-weight:900;color:#ff7a18}
footer{margin-top:20px;color:#7e899a;font-size:13px}@media(max-width:650px){.timer{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.panel{border-radius:20px}}
</style></head>
<body><main class="wrap"><div class="brand">DW TECH</div><section class="panel">
<h1 id="title">Eleições 2026</h1><div class="sub" id="targetText">Contagem regressiva para o encerramento da votação • 04/10/2026 às 17:00</div>
<div class="timer" id="timer">
<div class="box"><span class="num" id="days">00</span><span class="lab">Dias</span></div>
<div class="box"><span class="num" id="hours">00</span><span class="lab">Horas</span></div>
<div class="box"><span class="num" id="minutes">00</span><span class="lab">Minutos</span></div>
<div class="box"><span class="num" id="seconds">00</span><span class="lab">Segundos</span></div></div>
<div class="actions"><button onclick="shareWhatsApp()">Compartilhar no WhatsApp</button><button class="secondary" onclick="share()">Compartilhar</button><button class="secondary" onclick="fullscreen()">Tela cheia</button></div>
</section><footer>Dill • Tecnologia • Design • Inovação</footer></main>
<script>
const $=id=>document.getElementById(id);let end=new Date('2026-10-04T17:00:00-03:00').getTime(),interval;
function pad(n){return String(n).padStart(2,'0')}
function tick(){if(!end)return;let diff=end-Date.now();if(diff<=0){$('timer').innerHTML='<div class="done" style="grid-column:1/-1">CHEGOU A HORA!</div>';clearInterval(interval);return}const d=Math.floor(diff/864e5);diff%=864e5;const h=Math.floor(diff/36e5);diff%=36e5;const m=Math.floor(diff/6e4);const s=Math.floor((diff%6e4)/1000);$('days').textContent=pad(d);$('hours').textContent=pad(h);$('minutes').textContent=pad(m);$('seconds').textContent=pad(s)}
function shareWhatsApp(){const url=location.href.split('?')[0];const msg='⏱️ *Contagem Regressiva — Eleições 2026*\n\nAcompanhe a contagem até 04/10/2026 às 17h.\n\n'+url;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}
async function share(){const data={title:'Contagem Regressiva — Eleições 2026',text:'Acompanhe a contagem regressiva até 04/10/2026 às 17h.',url:location.href.split('?')[0]};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{await navigator.clipboard.writeText(data.url);alert('Link copiado!')}}
function fullscreen(){document.documentElement.requestFullscreen?.()}
tick();interval=setInterval(tick,1000);
</script></body></html>
