name: Publicar Dill Resgate

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "*/5 20-23 4 10 *"
    - cron: "*/5 0-6 5 10 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar base oficial de candidatos 2026
        run: python3 bu2026/sync_tse.py

      - name: Atualizar resultados oficiais TSE 2026
        run: python3 bu2026/sync_resultados_tse.py

      - name: Preparar leitor oficial de B.U. 2026
        run: |
          mkdir -p /tmp/bu-playwright
          npm install --prefix /tmp/bu-playwright playwright@1.55.0
          /tmp/bu-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Atualizar B.U.s de Vitorino Freire
        env:
          NODE_PATH: /tmp/bu-playwright/node_modules
        run: node bu2026/sync_vitorino_bu.js


      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
